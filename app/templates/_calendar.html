<div class="calendar-widget">
  <div class="calendar-header">
    <button class="calendar-nav-btn" onclick="Calendar.change(-1)">&#10094;</button>
    <span id="calendarMonthYear" class="calendar-title">Month Year</span>
    <button class="calendar-nav-btn" onclick="Calendar.change(1)">&#10095;</button>
  </div>
  <div class="calendar-weekdays">
    <div>Su</div><div>Mo</div><div>Tu</div><div>We</div>
    <div>Th</div><div>Fr</div><div>Sa</div>
  </div>
  <div class="calendar-days" id="calendarDays"></div>
</div>
